<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Boss Chill Zone 😌</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #74ebd5, #ACB6E5);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Arial', sans-serif;
}

.game {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  width: 300px;
}

h1 {
  margin-bottom: 10px;
}

.stress {
  font-size: 20px;
  margin: 15px 0;
}

.bar {
  width: 100%;
  height: 20px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 100%;
  background: #ff4d4d;
  transition: width 0.3s;
}

button {
  margin-top: 20px;
  padding: 15px;
  width: 100%;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #4CAF50;
  color: white;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="game">
  <h1>Chill Zone 😌</h1>
  <p>Click to relax</p>

  <div class="stress">Stress Level</div>
  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

  <button onclick="relax()">Take a Deep Breath 🌿</button>
</div>

<audio id="music" autoplay loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_8c6b1d9c6c.mp3" type="audio/mpeg">
</audio>

<script>
let stress = 100;
const fill = document.getElementById("fill");

function relax() {
  stress -= 10;
  if (stress < 0) stress = 0;
  fill.style.width = stress + "%";

  if (stress === 0) {
    alert("Boss is now fully chilled 😎");
  }
}
</script>

</body>
</html>
